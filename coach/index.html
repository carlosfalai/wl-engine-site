<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coach</title>
<link rel="stylesheet" href="../shared/ui.css">
</head>
<body>
<div class="wl-app">
  <header class="wl-header">
    <div class="wl-brand">
      <img data-brand-logo style="display:none" alt="logo">
      <div>
        <div class="wl-brand-name" data-brand-name>Coach</div>
      </div>
    </div>
    <nav class="wl-nav">
      <a href="../" data-i18n="home">Accueil</a>
      <span id="wl-user-info" class="wl-hidden">
        <span data-i18n="signed_in_as">Connecté en tant que</span> <strong id="wl-user-email"></strong>
        &nbsp;·&nbsp;<a href="#" id="wl-signout" data-i18n="sign_out">Déconnexion</a>
      </span>
      <button class="wl-lang-toggle" id="wl-lang-btn" type="button">FR | EN | ES</button>
    </nav>
  </header>

  <div id="wl-config-error"></div>
  <div id="wl-checkout-banner"></div>

  <!-- Sign-in state -->
  <section id="wl-signin-section" class="wl-signin-box">
    <h1 data-i18n="coach_title">Coach</h1>
    <p data-i18n="coach_desc">Plan d'entraînement hebdomadaire personnalisé, livré en PDF.</p>
    <div id="wl-gsi-btn"></div>
    <div id="wl-signin-error"></div>
  </section>

  <!-- Profile + generate state -->
  <section id="wl-app-section" class="wl-hidden">
    <div class="wl-section" id="wl-tier-section" style="margin-top:0">
      <div class="wl-tier-badge-row">
        <span class="wl-badge" id="wl-tier-badge"></span>
        <span class="wl-remaining" id="wl-remaining-label"></span>
        <button class="wl-btn wl-btn-outline wl-hidden" id="wl-manage-sub-btn" type="button" data-i18n="manage_subscription">Gérer mon abonnement</button>
      </div>
      <div class="wl-card wl-upgrade-card wl-hidden" id="wl-upgrade-card">
        <h3 data-i18n="upgrade_card_title">Passez au forfait Membre</h3>
        <p data-i18n="upgrade_card_body">Plus de plans, analyse photo et historique complet.</p>
        <p class="wl-tier-price" id="wl-upgrade-price"></p>
        <button class="wl-btn" id="wl-upgrade-btn" type="button" data-i18n="become_member">Devenir membre</button>
      </div>
    </div>

    <div class="wl-section">
      <h2 data-i18n="coach_title">Coach</h2>
      <div id="wl-profile-saved-line" class="wl-hidden" style="margin:0 0 12px;color:var(--wl-muted,#666);font-size:0.9em"></div>
      <div id="wl-form-error"></div>
      <form id="wl-profile-form" class="wl-form">
        <div class="wl-form-grid">
          <div class="wl-field">
            <label data-i18n="height_label">Taille (cm)</label>
            <input type="number" name="height_cm" required min="100" max="250">
          </div>
          <div class="wl-field">
            <label data-i18n="weight_label">Poids (kg)</label>
            <input type="number" name="weight_kg" required min="30" max="300" step="0.1">
          </div>
          <div class="wl-field">
            <label data-i18n="age_label">Âge</label>
            <input type="number" name="age" required min="13" max="100">
          </div>
          <div class="wl-field">
            <label data-i18n="gender_label">Sexe</label>
            <select name="gender" required>
              <option value="male" data-i18n="gender_male">Homme</option>
              <option value="female" data-i18n="gender_female">Femme</option>
              <option value="other" data-i18n="gender_other">Autre</option>
            </select>
          </div>
          <div class="wl-field">
            <label data-i18n="goal_label">Objectif</label>
            <select name="fitness_goal" required>
              <option value="fat_loss" data-i18n="goal_fat_loss">Perte de gras</option>
              <option value="muscle_gain" data-i18n="goal_muscle_gain">Gain musculaire</option>
              <option value="maintenance" data-i18n="goal_maintenance">Maintien</option>
            </select>
          </div>
          <div class="wl-field">
            <label data-i18n="days_per_week_label">Jours par semaine</label>
            <input type="number" name="days_per_week" required min="1" max="7">
          </div>
          <div class="wl-field">
            <label data-i18n="target_weight_label">Poids cible (kg)</label>
            <input type="number" name="target_weight_kg" min="30" max="300" step="0.1">
          </div>
          <div class="wl-field">
            <label data-i18n="weekly_food_budget_label">Budget épicerie / semaine</label>
            <input type="number" name="weekly_food_budget" min="0" step="1">
          </div>
          <div class="wl-field">
            <label data-i18n="postal_label">Code postal</label>
            <input type="text" name="postal_code" id="wl-postal-input" required>
          </div>
          <div class="wl-field wl-hidden" id="wl-country-field">
            <label data-i18n="country_label">Pays</label>
            <select name="country" id="wl-country-select"></select>
            <span class="wl-country-hint wl-hidden" id="wl-country-hint" data-i18n="country_other_hint"></span>
          </div>
          <div class="wl-field">
            <label data-i18n="nearest_gym_label">Gym le plus proche</label>
            <input type="text" name="nearest_gym">
          </div>
          <div class="wl-field full">
            <label data-i18n="injuries_label">Blessures (facultatif)</label>
            <textarea name="injuries_text" data-i18n-placeholder="injuries_placeholder" placeholder="ex. genou gauche, léger, depuis 2024"></textarea>
          </div>
          <div class="wl-field full">
            <label data-i18n="diet_restrictions_label">Restrictions alimentaires (séparées par des virgules)</label>
            <input type="text" name="diet_restrictions_text" data-i18n-placeholder="diet_restrictions_placeholder" placeholder="ex. sans gluten, sans arachides">
          </div>
          <div class="wl-field full wl-hidden" id="wl-photo-field">
            <label data-i18n="photo_label">Photo (facultatif)</label>
            <input type="file" name="photo" accept="image/*">
          </div>
        </div>
        <button type="submit" class="wl-btn" id="wl-generate-btn" data-i18n="generate_plan">Générer mon plan</button>
      </form>

      <div id="wl-progress" class="wl-progress wl-hidden">
        <div class="wl-spinner"></div>
        <div data-i18n="generating">Analyse en cours, 30 à 90 secondes...</div>
      </div>

      <div id="wl-result" class="wl-hidden">
        <div class="wl-alert wl-alert-success">
          <a id="wl-pdf-link" class="wl-btn" href="#" target="_blank" data-i18n="open_pdf">Ouvrir le PDF</a>
        </div>
      </div>
    </div>

    <div class="wl-section">
      <h2 data-i18n="my_plans">Mes plans</h2>
      <div id="wl-plans-list"></div>
    </div>
  </section>
</div>

<script src="../shared/config.js"></script>
<script src="../shared/brand.js"></script>
<script src="../shared/app.js"></script>
<script>
  WLApp.applyI18n();

  var countrySelect = document.getElementById('wl-country-select');
  countrySelect.innerHTML = WLApp.countries.map(function (c) {
    return '<option value="' + c[0] + '">' + c[1] + '</option>';
  }).join('');
  countrySelect.value = 'CA';

  var countryHint = document.getElementById('wl-country-hint');
  countrySelect.addEventListener('change', function () {
    countryHint.classList.toggle('wl-hidden', countrySelect.value !== '');
  });

  var postalInput = document.getElementById('wl-postal-input');
  var countryField = document.getElementById('wl-country-field');
  function checkPostal() {
    if (postalInput.value && !WLApp.looksLikeCaOrUs(postalInput.value)) {
      countryField.classList.remove('wl-hidden');
    } else {
      countryField.classList.add('wl-hidden');
      countryHint.classList.add('wl-hidden');
    }
  }
  postalInput.addEventListener('input', checkPostal);
  postalInput.addEventListener('blur', checkPostal);

  WLApp.initLangToggle(document.getElementById('wl-lang-btn'), { postPreference: true });

  if (new URLSearchParams(location.search).get('checkout') === 'success') {
    var checkoutBanner = document.getElementById('wl-checkout-banner');
    var cleanUrl = location.pathname + (WLApp.getPartner() ? '?p=' + encodeURIComponent(WLApp.getPartner()) : '');
    history.replaceState(null, '', cleanUrl);
    if (WLApp.getToken()) {
      // The Stripe webhook that flips tier to 'member' can land after the
      // browser redirect back — show "activating" and poll /me until the
      // tier is actually member instead of claiming success too early.
      checkoutBanner.innerHTML = '<div class="wl-alert wl-alert-success">' + WLApp.t('checkout_activating') + '</div>';
      WLApp.pollForMembership(function (user) {
        applyTierUI(user);
        if (user.tier === 'member') {
          checkoutBanner.innerHTML = '<div class="wl-alert wl-alert-success">' + WLApp.t('checkout_thanks') + '</div>';
        }
      });
    } else {
      checkoutBanner.innerHTML = '<div class="wl-alert wl-alert-success">' + WLApp.t('checkout_thanks') + '</div>';
    }
  }

  var siteConfig = null;
  WLApp.fetchConfig().then(function (config) {
    siteConfig = config;
    applyBrand(config);
  }).catch(function () {
    WLApp.showError(document.getElementById('wl-config-error'), WLApp.t('service_unavailable'));
  });

  var signinSection = document.getElementById('wl-signin-section');
  var appSection = document.getElementById('wl-app-section');
  var userInfo = document.getElementById('wl-user-info');
  var userEmail = document.getElementById('wl-user-email');

  function startCheckout() {
    var returnUrl = location.origin + location.pathname + '?checkout=success' + (WLApp.getPartner() ? '&p=' + encodeURIComponent(WLApp.getPartner()) : '');
    WLApp.api('/billing/checkout', { method: 'POST', body: { success_url: returnUrl, cancel_url: location.origin + location.pathname } })
      .then(function (data) { if (data.url) location.href = data.url; })
      .catch(function () { WLApp.showError(document.getElementById('wl-form-error'), WLApp.t('error_generic')); });
  }

  function applyTierUI(me) {
    var tier = me.tier || 'free';
    var limits = me.limits || {};
    var remaining = me.remaining || {};
    var badge = document.getElementById('wl-tier-badge');
    badge.textContent = WLApp.t('your_tier') + ': ' + (tier === 'member' ? WLApp.t('tier_member') : WLApp.t('tier_free'));

    var remainingLabel = document.getElementById('wl-remaining-label');
    var manageBtn = document.getElementById('wl-manage-sub-btn');
    var upgradeCard = document.getElementById('wl-upgrade-card');
    var photoField = document.getElementById('wl-photo-field');

    if (tier === 'member') {
      var remainingCount = (remaining.today !== undefined) ? remaining.today : remaining.month;
      var remainingWord = (remaining.today !== undefined) ? WLApp.t('plans_remaining_today') : WLApp.t('plans_remaining_month');
      remainingLabel.textContent = (remainingCount !== undefined ? remainingCount + ' ' + remainingWord : '');
      manageBtn.classList.remove('wl-hidden');
      upgradeCard.classList.add('wl-hidden');
      photoField.classList.remove('wl-hidden');
    } else {
      remainingLabel.textContent = (remaining.month !== undefined ? remaining.month + ' ' + WLApp.t('plans_remaining_month') : '');
      manageBtn.classList.add('wl-hidden');
      upgradeCard.classList.remove('wl-hidden');
      document.getElementById('wl-upgrade-price').textContent = (siteConfig && siteConfig.member_price_label) || '';
      photoField.classList.add('wl-hidden');
    }
  }

  document.getElementById('wl-manage-sub-btn').addEventListener('click', function () {
    WLApp.api('/billing/portal', { method: 'POST', body: { return_url: location.href } })
      .then(function (data) { if (data.url) location.href = data.url; })
      .catch(function () {});
  });
  document.getElementById('wl-upgrade-btn').addEventListener('click', startCheckout);

  function prefillCoachProfile(profile, complete) {
    if (!profile) return;
    var form = document.getElementById('wl-profile-form');
    ['height_cm', 'weight_kg', 'age', 'gender', 'fitness_goal', 'days_per_week', 'target_weight_kg', 'weekly_food_budget', 'postal_code', 'nearest_gym'].forEach(function (name) {
      if (profile[name] === undefined || profile[name] === null) return;
      var field = form.elements[name];
      if (field) field.value = profile[name];
    });
    if (profile.postal_code) checkPostal();
    if (profile.country) countrySelect.value = profile.country;
    if (Array.isArray(profile.injuries) && profile.injuries.length) {
      form.elements.injuries_text.value = profile.injuries.map(function (i) { return i.description || i.body_zone || ''; }).filter(Boolean).join('; ');
    }
    if (Array.isArray(profile.diet_restrictions) && profile.diet_restrictions.length) {
      form.elements.diet_restrictions_text.value = profile.diet_restrictions.join(', ');
    }
    var savedLine = document.getElementById('wl-profile-saved-line');
    if (complete) {
      savedLine.textContent = WLApp.t('profile_saved') + (profile.saved_at ? ' (' + new Date(profile.saved_at).toLocaleDateString() + ')' : '');
      savedLine.classList.remove('wl-hidden');
    }
  }

  function showApp(user) {
    signinSection.classList.add('wl-hidden');
    appSection.classList.remove('wl-hidden');
    userInfo.classList.remove('wl-hidden');
    userEmail.textContent = (user && user.email) || '';
    loadPlans();
    WLApp.api('/me').then(function (data) {
      applyTierUI(data);
      prefillCoachProfile((data.user || data).profile, data.profile_complete && data.profile_complete.coach);
      if (new URLSearchParams(location.search).get('upgrade') === '1' && (data.user || data).tier !== 'member') {
        startCheckout();
      }
    }).catch(function () {});
  }

  document.getElementById('wl-signout').addEventListener('click', function (e) {
    e.preventDefault();
    WLApp.clearToken();
    location.reload();
  });

  if (WLApp.getToken()) {
    WLApp.api('/me').then(function (data) {
      showApp(data.user);
    }).catch(function () {
      WLApp.clearToken();
    });
  } else {
    WLApp.initGoogleSignIn(document.getElementById('wl-gsi-btn'), function (credential) {
      WLApp.api('/auth/google', { method: 'POST', body: { credential: credential, partner: WLApp.getPartner() } })
        .then(function (data) {
          WLApp.setToken(data.token);
          showApp(data.user);
        })
        .catch(function () {
          WLApp.showError(document.getElementById('wl-signin-error'), WLApp.t('error_generic'));
        });
    });
  }

  document.getElementById('wl-profile-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var form = e.target;
    var fd = new FormData(form);
    var injuries = [];
    var injuriesText = (fd.get('injuries_text') || '').trim();
    if (injuriesText) {
      injuries.push({ body_zone: injuriesText, severity: 'mild', description: injuriesText });
    }
    var dietText = (fd.get('diet_restrictions_text') || '').trim();
    var dietRestrictions = dietText ? dietText.split(',').map(function (s) { return s.trim(); }).filter(Boolean).slice(0, 10) : undefined;
    var profile = {
      height_cm: Number(fd.get('height_cm')),
      weight_kg: Number(fd.get('weight_kg')),
      age: Number(fd.get('age')),
      gender: fd.get('gender'),
      fitness_goal: fd.get('fitness_goal'),
      days_per_week: Number(fd.get('days_per_week')),
      target_weight_kg: fd.get('target_weight_kg') ? Number(fd.get('target_weight_kg')) : undefined,
      weekly_food_budget: fd.get('weekly_food_budget') ? Number(fd.get('weekly_food_budget')) : undefined,
      postal_code: fd.get('postal_code'),
      country: countryField.classList.contains('wl-hidden') ? undefined : fd.get('country'),
      nearest_gym: fd.get('nearest_gym') || undefined,
      language: WLApp.lang,
      injuries: injuries,
      diet_restrictions: dietRestrictions
    };

    var errorEl = document.getElementById('wl-form-error');
    errorEl.innerHTML = '';
    var btn = document.getElementById('wl-generate-btn');
    btn.disabled = true;

    WLApp.api('/coach/profile', { method: 'POST', body: profile })
      .then(function () {
        document.getElementById('wl-progress').classList.remove('wl-hidden');
        document.getElementById('wl-result').classList.add('wl-hidden');

        var genFd = new FormData();
        var photo = fd.get('photo');
        if (photo && photo.size > 0) genFd.append('photo', photo);
        genFd.append('language', WLApp.lang);

        return WLApp.api('/coach/generate', { method: 'POST', formData: genFd });
      })
      .then(function (data) {
        document.getElementById('wl-progress').classList.add('wl-hidden');
        document.getElementById('wl-result').classList.remove('wl-hidden');
        document.getElementById('wl-pdf-link').href = data.pdf_url;
        loadPlans();
        WLApp.api('/me').then(function (d) { applyTierUI(d); }).catch(function () {});
      })
      .catch(function (err) {
        document.getElementById('wl-progress').classList.add('wl-hidden');
        WLApp.showError(errorEl, WLApp.genErrorMessage(err));
      })
      .finally(function () {
        btn.disabled = false;
      });
  });

  function loadPlans() {
    var listEl = document.getElementById('wl-plans-list');
    WLApp.api('/plans').then(function (data) {
      var plans = (data.plans || []).filter(function (p) { return p.product === 'coach'; });
      if (!plans.length) {
        listEl.innerHTML = '<p>' + WLApp.t('no_plans_yet') + '</p>';
        return;
      }
      // plan id/created_at are API data - build rows via DOM, never innerHTML.
      listEl.innerHTML = '<table class="wl-table"><thead><tr><th>' + WLApp.t('date_label') + '</th><th></th></tr></thead></table>';
      var tbody = document.createElement('tbody');
      plans.forEach(function (p) {
        var tr = document.createElement('tr');
        var dateTd = document.createElement('td');
        dateTd.textContent = new Date(p.created_at).toLocaleDateString();
        tr.appendChild(dateTd);
        var linkTd = document.createElement('td');
        var a = document.createElement('a');
        a.href = '#';
        a.className = 'wl-open-plan';
        a.dataset.planId = p.id;
        a.textContent = WLApp.t('open_pdf');
        linkTd.appendChild(a);
        tr.appendChild(linkTd);
        tbody.appendChild(tr);
      });
      listEl.querySelector('table').appendChild(tbody);
      listEl.querySelectorAll('.wl-open-plan').forEach(function (a) {
        a.addEventListener('click', function (e) {
          e.preventDefault();
          WLApp.api('/plans/' + a.getAttribute('data-plan-id') + '/pdf').then(function (d) {
            window.open(d.url, '_blank');
          });
        });
      });
    }).catch(function () {
      listEl.innerHTML = '<p>' + WLApp.t('no_plans_yet') + '</p>';
    });
  }
</script>
</body>
</html>
